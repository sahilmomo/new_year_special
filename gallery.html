<script>
const music=document.getElementById("music");

window.onload=()=>{
  music.src=localStorage.song;
  music.currentTime=localStorage.time||0;
  music.volume=localStorage.vol||0.7;
  if(localStorage.play==="yes") music.play();
};

function toggleMusic(){
  music.paused
  ? (music.play(),localStorage.play="yes")
  : (music.pause(),localStorage.play="no");
}

let photos=[];
for(let i=1;i<=110;i++) photos.push("mamamine"+i+".jpeg");
let i=0;
setInterval(()=>{
  i=(i+1)%photos.length;
  slide.src=photos[i];
},2000);
</script>
